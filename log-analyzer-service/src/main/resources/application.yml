spring:
  application:
    name: log-analyzer-service
  ai:
    openai:
      api-key: not-needed
      base-url: http://192.168.1.107:8080
      chat:
        options:
          model: /opt/models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
          max-tokens: 2000
    ollama:
      base-url: http://10.13.218.80:11434
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: 8081

vantage:
  vantage-mcp-server:
    upload-url: http://192.168.1.108:8091/api/logs/upload    # Server3->Server2
                                                                 # server-to-server hop,
                                                                 # confirmed working via
                                                                 # curl -- browser never
                                                                 # calls this directly
  ollama:
    models:
      - key: gpt-oss-20b
        label: "GPT-OSS 20B (GPU)"
        model-name: gpt-oss:20b
      - key: gemma4-12b
        label: "Gemma 4 12B (GPU)"
        model-name: gemma4:12b
      - key: qwen3-8b
        label: "Qwen3 8B (GPU)"
        model-name: qwen3:8b
  mcp:
    toolgroups:
      # Single consolidated MCP server (was three: logs/code/jira_rag on
      # 8091/8092/8093). All tools now come from one connection.
      vantage:
        url: http://192.168.1.108:8091/mcp
