spring:
  application:
    name: log-mcp-server
  ai:
    mcp:
      server:
        name: log-mcp-server
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

server:
  port: 8091

vantage:
  elasticsearch:
    host: localhost
    port: 9200
    username: elastic
    password: ${ES_PASSWORD}
  upload:
    allowed-origin: http://SERVER3-IP:8081    # Server3's own IP (where log-analyzer-service
                                                # runs) -- fill this in; I mistakenly copied
                                                # Server1's IP here originally, since this is
                                                # the first config that's ever needed to
                                                # reference Server3's own address rather than
                                                # be referenced BY something else