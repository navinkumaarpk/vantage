spring:
  application:
    name: jira-rag-mcp-server
  ai:
    mcp:
      server:
        name: jira-rag-mcp-server
        protocol: STREAMABLE
        annotation-scanner:
          enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/vantage_rag
    username: vantage
    password: ${PG_PASSWORD}    # set as an env var, not committed to the repo

server:
  port: 8093

vantage:
  embedding:
    url: http://192.168.1.107:8082/v1/embeddings
